name: Build and publish image

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read
  packages: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compute CalVer tag
        id: version
        run: echo "date=$(date -u +%Y.%m)" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to ghcr.io
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=${{ steps.version.outputs.date }}
            type=raw,value=latest
            type=sha,format=short

      - name: Build (and push on main)
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          # Always load into the runner's local Docker daemon (single
          # platform, so push+load together are fine) -- otherwise the
          # smoke-test step below has to re-pull the image it just pushed,
          # which is wasteful and flaky against registry rate limits.
          load: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test image and capture versions
        id: versions
        run: |
          # The base image's ENTRYPOINT is the `vllm` CLI itself, so without
          # --entrypoint here "python -c ..." is appended as arguments to
          # `vllm serve` instead of actually running python. The image only
          # has `python3` on PATH, not a bare `python`.
          out=$(docker run --rm -e VLLM_TARGET_DEVICE=cpu --entrypoint python3 \
            "${{ fromJSON(steps.meta.outputs.json).tags[0] }}" \
            -c "import torch, vllm, transformers; print(f'torch={torch.__version__}'); print(f'vllm={vllm.__version__}'); print(f'transformers={transformers.__version__}')")
          echo "$out"
          # Sanitize into valid Docker tag characters (e.g. a '+local' build
          # suffix isn't legal in a tag) before exposing as step outputs.
          echo "$out" | sed -E 's/[^A-Za-z0-9=_.-]/-/g' >> "$GITHUB_OUTPUT"

      - name: Tag and push version-labeled image
        if: github.event_name != 'pull_request'
        run: |
          src="${{ fromJSON(steps.meta.outputs.json).tags[0] }}"
          tag="${{ env.IMAGE }}:vllm${{ steps.versions.outputs.vllm }}-transformers${{ steps.versions.outputs.transformers }}"
          docker tag "$src" "$tag"
          docker push "$tag"

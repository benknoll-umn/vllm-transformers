[project]
name = "vllm-transformers"
version = "0.1.0"
description = "Pinned Python dependencies layered onto vllm/vllm-openai for serving current open-weight models via vLLM's Transformers backend."
requires-python = ">=3.12"
dependencies = [
    "transformers==5.16.1",
    "kernels==0.16.1",
    "accelerate==1.14.0",
    "hf-transfer==0.1.9",
]
